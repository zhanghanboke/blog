name: Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动构建发布
  push:
    branches: [main]
  # 允许在 Actions 页面手动点「Run workflow」
  workflow_dispatch:

# 显式声明令牌权限：仓库默认是只读，没有 pages:write 会 403 部署失败
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个部署任务同时进行
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
